[project]
name = "saas-comparison-preflight"
version = "0.1.0"
description = "Deterministic preflight core for a source-backed SaaS pricing and TCO comparison service"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cryptography==49.0.0",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
]

[project.scripts]
saas-preflight = "saas_preflight.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "pytest>=8,<10",
  "respx>=0.22,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saas_preflight"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
